<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Queue System | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-box">
    <h1>Smart Queue Management</h1>
    <p class="subtitle">College Service Desk Login</p>

    <div th:if="${param.error}" class="alert danger">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert success">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <div class="info-box">
        <strong>Demo credentials:</strong>
        <p>Username: admin</p>
        <p>Password: set via APP_ADMIN_PASSWORD environment variable</p>
    </div>
</div>
</body>
</html>
